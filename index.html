<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://viacep.com.br; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>2 na Fronteiras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: sidebar marrom-escuro fixa + área de trabalho creme; motivo da linha pontilhada de rota com avião e coração */
:root{
  --bg:#F7EFE2; --surface:#FFFAF2; --surface-2:#F1E5D1; --line:#E3D0B3;
  --ink:#3A2416; --ink-2:#6E5441; --ink-3:#98816C;
  --caramel:#AE6A2F; --caramel-ink:#FFF7EA; --gold:#C2923A; --brown:#6E4122;
  --side:#3A2416; --side-ink:#F3E6D2; --side-ink-2:#C9AF8F; --side-hi:#523422;
  --ok:#2E7743; --ok-bg:#E0EDDA; --warn:#8E6604; --warn-bg:#F6E7BF; --bad:#AE3529; --bad-bg:#F7DBD3; --mut:#6C5D50; --mut-bg:#EAE0D1;
  --wa:#1E8B4C; --wa-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(58,36,22,.06),0 8px 22px -14px rgba(58,36,22,.35);
  --f-title:'Great Vibes','Brush Script MT',cursive;
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C150F; --surface:#261C15; --surface-2:#31251B; --line:#44352A;
  --ink:#F3E7D5; --ink-2:#C9B39A; --ink-3:#9A8670;
  --caramel:#D9955A; --caramel-ink:#1C130C; --gold:#E2B862; --brown:#C38A57;
  --side:#130E0A; --side-ink:#F3E6D2; --side-ink-2:#B49B7E; --side-hi:#2E2219;
  --ok:#7CC18D; --ok-bg:#1D3224; --warn:#E5BA4F; --warn-bg:#3A2E12; --bad:#F08070; --bad-bg:#45201A; --mut:#BCAA97; --mut-bg:#33291F;
  --wa:#2FA864; --wa-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -14px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C150F; --surface:#261C15; --surface-2:#31251B; --line:#44352A;
  --ink:#F3E7D5; --ink-2:#C9B39A; --ink-3:#9A8670;
  --caramel:#D9955A; --caramel-ink:#1C130C; --gold:#E2B862; --brown:#C38A57;
  --side:#130E0A; --side-ink:#F3E6D2; --side-ink-2:#B49B7E; --side-hi:#2E2219;
  --ok:#7CC18D; --ok-bg:#1D3224; --warn:#E5BA4F; --warn-bg:#3A2E12; --bad:#F08070; --bad-bg:#45201A; --mut:#BCAA97; --mut-bg:#33291F;
  --wa:#2FA864; --wa-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -14px rgba(0,0,0,.7);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.num{font-variant-numeric:tabular-nums}
a{color:var(--caramel)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- Sidebar ---------- */
.side{position:fixed;top:0;bottom:0;left:0;width:252px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:30;
  padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 6px 14px}
.logo-slot{width:78px;height:78px;border-radius:50%;border:1.5px dashed var(--side-ink-2);background:transparent;color:var(--side-ink-2);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0}
.logo-slot.has{border-style:solid;border-color:var(--gold);background:var(--side-hi)}
.logo-slot img{width:100%;height:100%;object-fit:cover}
.logo-ph{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.brand-name{font-family:var(--f-title);font-size:38px;line-height:1.1;color:var(--gold);margin-top:6px;white-space:nowrap}
.route{width:100%;color:var(--side-ink-2)}
.route svg{width:100%;height:34px;display:block}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-hi);color:var(--side-ink)}
.nav a.on{background:var(--side-hi);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--gold)}
.nav a .nb{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:16px 8px 0;font-size:11.5px;color:var(--side-ink-2);display:flex;align-items:center;gap:6px;justify-content:center}
.side-foot .ic{width:14px;height:14px;color:var(--gold)}
.scrim{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:25}

/* ---------- Main ---------- */
.main-wrap{margin-left:252px;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.topbar h1{font-size:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:10px}
.menu-btn{display:none}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.bell.alert{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.bell .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.bell.alert .ic{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion:reduce){.bell.alert .ic{animation:none}}
.dbnote{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:500}
main{max-width:1240px}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:var(--caramel)}
.btn.primary{background:var(--caramel);border-color:var(--caramel);color:var(--caramel-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger-ghost{background:transparent;color:var(--bad);border-color:transparent}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink)}
.btn.wa.disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn.sm{width:32px;height:32px;border-radius:8px}.icon-btn.del{color:var(--bad)}.icon-btn.del:hover{border-color:var(--bad);background:var(--bad-bg)}
.acts{display:inline-flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);flex:none}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
.in:focus{outline:none;border-color:var(--caramel);box-shadow:0 0 0 3px color-mix(in srgb,var(--caramel) 22%,transparent)}
.in[readonly],.in:disabled{background:var(--surface-2);color:var(--ink-2)}
textarea.in{min-height:70px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--ink-2)}
.field>span em{color:var(--bad);font-style:normal}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c1{grid-column:span 1}
.hint{font-size:12px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--brown);color:var(--caramel-ink)}
:root:not([data-theme="light"]) .seg button.on{color:var(--bg)}

/* ---------- Panels / pills ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.p-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.p-head h3{font-size:16px}
.p-head .sp{flex:1}
.count{font-size:12px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--mut-bg);color:var(--mut)}
.count.bad{background:var(--bad-bg);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--mut-bg);color:var(--mut)}
.pill.gold{background:color-mix(in srgb,var(--gold) 20%,transparent);color:var(--brown)}
.muted-note{color:var(--ink-3);padding:14px 4px;margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.search{position:relative}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:18px;height:18px}
.search .in{padding-left:36px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--caramel);font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:10px}

/* ---------- Hero (Painel) ---------- */
.hero{display:flex;align-items:center;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.hero .logo-slot{width:72px;height:72px;border-color:var(--ink-3);color:var(--ink-3)}
.hero .logo-slot.has{border-color:var(--gold);background:var(--surface)}
.hero-txt{flex:1;min-width:220px}
.hero-title{font-family:var(--f-title);font-size:52px;line-height:1;color:var(--brown)}
.hero-route{color:var(--caramel);max-width:380px}
.hero-route svg{width:100%;height:30px;display:block}
.hero-date{color:var(--ink-2);font-size:13px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;text-align:left}
button.kpi{cursor:pointer;font:inherit;color:inherit}
.kpi .k-lab{font-size:12.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .k-lab .ic{width:17px;height:17px;color:var(--caramel)}
.kpi .k-val{font-size:26px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.kpi .k-sub{font-size:12.5px;color:var(--ink-3)}
.kpi.hero-k{background:var(--brown);border-color:var(--brown);color:var(--caramel-ink)}
.kpi.hero-k .k-lab,.kpi.hero-k .k-sub{color:color-mix(in srgb,var(--caramel-ink) 75%,transparent)}
.kpi.hero-k .k-lab .ic{color:var(--gold)}
:root:not([data-theme="light"]) .kpi.hero-k{color:var(--bg)}
.kpi.alert{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.kpi.alert .k-val,.kpi.alert .k-lab,.kpi.alert .k-lab .ic{color:var(--bad)}
.kpi.alert .k-sub{color:var(--bad);opacity:.85}
.kpi.span2{grid-column:span 2}
.kpi .duo{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.kpi .duo small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

/* ---------- Parcel rows ---------- */
.plist{display:flex;flex-direction:column}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:12px 2px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pr-main{flex:1 1 170px;min-width:0}
.pr-cli{font-weight:600;overflow-wrap:anywhere}
.pr-sub{font-size:12.5px;color:var(--ink-3)}
.pr-val{font-variant-numeric:tabular-nums;text-align:right;min-width:96px}
.pr-val small{display:block;color:var(--ink-3);font-size:11.5px}
.pr-date{font-variant-numeric:tabular-nums;min-width:84px;font-size:13px}
.pr-date small{display:block;color:var(--ink-3);font-size:11px}
.pr-act{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.prow.atrasada{box-shadow:inset 3px 0 0 var(--bad);padding-left:12px}
.prow.hoje{box-shadow:inset 3px 0 0 var(--warn);padding-left:12px}

/* ---------- Trips ---------- */
.trips{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.trip:hover{border-color:var(--caramel)}
.trip::after{content:"";position:absolute;left:16px;right:16px;bottom:10px;border-bottom:1.5px dashed var(--line)}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-date{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.t-name{font-size:16px;font-weight:600}
.t-rateio{display:flex;align-items:baseline;gap:8px}
.t-rateio span{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.t-rateio b{font-size:28px;color:var(--caramel);font-variant-numeric:tabular-nums}
.t-dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0 0 12px}
.t-dl dt{font-size:11.5px;color:var(--ink-3)}
.t-dl dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.vhead{display:flex;gap:18px;align-items:stretch;flex-wrap:wrap;margin-bottom:14px}
.vh-l{flex:1 1 280px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.vh-l h2{font-size:24px}
.rateio-big{background:var(--brown);color:var(--caramel-ink);border-radius:var(--r);padding:14px 22px;display:flex;flex-direction:column;align-items:flex-start;min-width:190px}
:root:not([data-theme="light"]) .rateio-big{color:var(--bg)}
.rateio-big span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.rateio-big b{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--gold)}
:root:not([data-theme="light"]) .rateio-big b{color:var(--bg)}
.rateio-big small{opacity:.8;font-size:12px}
.vstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.vstats div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.vstats small{display:block;font-size:12px;color:var(--ink-3)}
.vstats b{font-size:17px;font-variant-numeric:tabular-nums}
.vh-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.vgrid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.drow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .d-t{flex:1;min-width:0}
.drow .d-t small{display:block;color:var(--ink-3);font-size:12px}
.drow .d-v{font-variant-numeric:tabular-nums;font-weight:500}
.dtotal{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line);padding-top:10px;margin-top:4px;font-weight:600}
.desp-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.desp-form .full{grid-column:1/-1}
.lockline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:12px}

/* ---------- Lista rápida de produtos ---------- */
.prodpanel{margin-bottom:16px}
.seg.sm button{padding:5px 11px;font-size:12.5px}
table.grid{min-width:1040px}
.grid td{padding:5px 5px;border-bottom:1px solid var(--line)}
.grid .in{padding:7px 9px;border-radius:8px;background:var(--surface)}
.grid .in.r{text-align:right}
.grid .in:disabled{background:transparent;border-color:transparent;color:var(--ink)}
.grid td.r{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink-2)}
.grid td.r b{color:var(--ink)}
.mo{border:0;background:var(--brown);color:var(--caramel-ink);border-radius:8px;padding:7px 10px;font-weight:600;font-size:12.5px;cursor:pointer;min-width:48px}
:root:not([data-theme="light"]) .mo{color:var(--bg)}
.mo:disabled{background:var(--surface-2);color:var(--ink-2);cursor:default}
.g-end{white-space:nowrap}
.g-st{font-size:12px;font-weight:600;margin-right:6px}.g-st.ok{color:var(--ok)}.g-st.inc{color:var(--warn)}.g-st.muted{color:var(--ink-3)}
.addrow{display:flex;align-items:center;gap:12px;margin-top:12px}
.plus{width:44px;height:44px;border-radius:50%;border:0;background:var(--caramel);color:var(--caramel-ink);font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 14px -6px rgba(110,65,34,.7);flex:none}
kbd{font:600 11px var(--f-body);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.gfoot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.gfoot>div{background:var(--surface-2);border-radius:10px;padding:10px 14px;min-width:0}
.gfoot small{display:block;font-size:12px;color:var(--ink-3)}.gfoot b{font-size:18px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.gfoot .w{background:var(--warn-bg);color:var(--warn)}.gfoot .w small{color:var(--warn)}
.gfoot .okb{background:var(--ok-bg);color:var(--ok)}.gfoot .okb small{color:var(--ok)}
.vgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.acdd{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -12px rgba(58,36,22,.45);overflow:hidden}
.ach{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);padding:9px 14px 5px;font-weight:600}
.aco{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}

let dCache=null,dVer=-1,dDay='';
function D(){
  const hoje=todayISO();
  if(dCache&&dVer===ver&&dDay===hoje)return dCache;
  const vMap=new Map(S.viagens.map(v=>[v.id,v]));
  const cMap=new Map(S.clientes.map(c=>[c.id,c]));
  const vendaMap=new Map(S.vendas.map(v=>[v.id,v]));
  const sold=new Map();
  for(const ve of S.vendas)for(const it of ve.itens||[])sold.set(it.produtoId,(sold.get(it.produtoId)||0)+(+it.qtd||0));
  const trip=new Map();
  for(const v of S.viagens){const det=(v.despesas||[]).length>0;trip.set(v.id,{v,prods:[],totalPago:0,despDet:det,despesas:det?sum(v.despesas,d=>d.valor):(+v.gastoTotal||0),rateio:0,fechada:v.status==='fechada'})}
  const prod=new Map();
  for(const p of S.produtos){
    const t=trip.get(p.viagemId);const cot=+(t&&t.v.cotacao)||0;
    const precoBRL=p.moeda==='USD'?(+p.preco||0)*cot:(+p.preco||0);
    const pi={p,t,precoBRL,qtd:+p.qtd||0,vendido:sold.get(p.id)||0};pi.estoque=pi.qtd-pi.vendido;
    prod.set(p.id,pi);if(t){t.prods.push(pi);t.totalPago+=precoBRL*pi.qtd}
  }
  for(const t of trip.values()){
    t.pecas=sum(t.prods,x=>x.qtd);t.estoque=sum(t.prods,x=>x.estoque);
    t.comprasInf=+t.v.comprasTotal>0;t.base=t.comprasInf?+t.v.comprasTotal:t.totalPago;
    t.rateio=t.fechada&&t.v.rateioFixo!=null?+t.v.rateioFixo:(t.base>0?t.despesas/t.base:0);
  }
  for(const pi of prod.values()){
    const t=pi.t;
    if(t&&t.fechada&&pi.p.custoFixo!=null){pi.precoBRL=+pi.p.precoBRLFixo;pi.custo=+pi.p.custoFixo}
    else pi.custo=r2(pi.precoBRL*(1+(t?t.rateio:0)));
    pi.rateioValor=r2(pi.custo-pi.precoBRL);
  }
  const parc=S.parcelas.map(p=>{
    const pago=r2(sum(p.pagamentos||[],x=>x.valor));const valor=+p.valor||0;const rest=r2(Math.max(0,valor-pago));
    let st;if(rest<=0.004)st='paga';else if(p.venc<hoje)st='atrasada';else if(p.venc===hoje)st='hoje';else st='avencer';
    return{...p,valor,pago,rest,st,dias:st==='atrasada'?diffDays(p.venc,hoje):0,cliente:cMap.get(p.clienteId),venda:vendaMap.get(p.vendaId)};
  });
  const parcMap=new Map(parc.map(p=>[p.id,p]));
  const cli=new Map();
  for(const c of S.clientes)cli.set(c.id,{gasto:0,deve:0,atraso:false,abertas:0,nCompras:0});
  for(const v of S.vendas){const a=cli.get(v.clienteId);if(a){a.gasto+=+v.total||0;a.nCompras++}}
  for(const p of parc){const a=cli.get(p.clienteId);if(a&&p.st!=='paga'){a.deve+=p.rest;a.abertas++;if(p.st==='atrasada')a.atraso=true}}
  const atrasadas=parc.filter(p=>p.st==='atrasada');
  dCache={hoje,vMap,cMap,vendaMap,trip,prod,parc,parcMap,cli,atrasadas};dVer=ver;dDay=hoje;
  return dCache;
}

}

const modalStack=[];
function openModal({title,body,wide,footer}){
  const el=document.createElement('div');el.className='modal-bg';
  el.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Fechar">${I.x}</button></div><div class="m-body">${body}</div>${footer?`<div class="m-foot">${footer}</div>`:''}</div>`;
  $('#modals').append(el);modalStack.push(el);

  document.body.style.overflow='hidden';
  return el;
}
function closeModal(el){el=el||modalStack[modalStack.length-1];if(!el)return;const i=modalStack.indexOf(el);if(i>=0)modalStack.splice(i,1);el.remove();el._onClose&&el._onClose();if(!modalStack.length)document.body.style.overflow=''}
function confirmBox(msg,ok='Excluir',danger=true){

}

    <label class="field c3"><span>Cotação do dólar (R$ por US$) <em>*</em></span><input class="in num" id="vCot" inputmode="decimal" value="${v?num2(v.cotacao):''}" placeholder="ex.: 5,40" ${fech?'disabled':''}></label>

const r2x=n=>Math.round(n*10000)/10000;
async function viagemStatus(id){
  if(!needDb())return;
  const d=D();const t=d.trip.get(id);if(!t)return;
  if(!t.fechada){
    if(!await confirmBox(`Fechar a viagem com rateio de <b>${pct(t.rateio*100)}</b>? O custo real dos ${t.prods.length} produtos fica travado e não muda mais.`,'Fechar viagem',false))return;
    try{
      await Promise.all(t.prods.map(pi=>patch('produtos',pi.p.id,{custoFixo:pi.custo,precoBRLFixo:r2(pi.precoBRL)})));
      await patch('viagens',id,{status:'fechada',rateioFixo:t.rateio,fechadaEm:todayISO()});
      toast('Viagem fechada. Custos travados.');
    }catch(e){dbErr(e)}
  }else{
    if(!await confirmBox('Reabrir a viagem? Os custos voltam a ser recalculados a cada produto ou despesa lançada. Vendas já feitas mantêm o custo gravado.','Reabrir',false))return;
    try{
      await Promise.all(t.prods.map(pi=>{const p={...raw('produtos',pi.p.id)};delete p.custoFixo;delete p.precoBRLFixo;return put('produtos',p.id,p)}));
      const v={...raw('viagens',id)};delete v.rateioFixo;delete v.fechadaEm;v.status='aberta';
      await put('viagens',id,v);toast('Viagem reaberta.');
    }catch(e){dbErr(e)}
  }
}
async function viagemExcluir(id){
  const t=D().trip.get(id);if(!t||!needDb())return;
  if(t.prods.some(pi=>pi.vendido>0)){toast('Esta viagem tem produtos vendidos e não pode ser excluída.','bad');return}
  if(!await confirmBox(`Excluir a viagem <b>${esc(t.v.descricao)}</b> e seus ${t.prods.length} produtos? Esta ação não pode ser desfeita.`))return;
  try{await Promise.all(t.prods.map(pi=>del('produtos',pi.p.id)));await Promise.all(S.notas.filter(n=>n.viagemId===id).map(n=>del('notas',n.id)));await del('viagens',id);ui.viagemId=null;toast('Viagem excluída.');renderFull()}catch(e){dbErr(e)}
}

const G={vid:null,ac:null};
const MOEDA_TXT={USD:'US$',BRL:'R$',PYG:'₲'};
function catalogo(){
  const d=D();const m=new Map();
  for(const pi of d.prod.values()){
    const k=norm(pi.p.nome);if(!k)continue;const dt=pi.t?String(pi.t.v.data):'';
    const cur=m.get(k);
    if(!cur||dt>cur.dt)m.set(k,{nome:pi.p.nome,categoria:pi.p.categoria||'',moeda:pi.p.moeda||'USD',preco:+pi.p.preco||0,viagem:pi.t?pi.t.v.descricao:'',dt});
  }
  return m;
}
function gridRow(id,p,isNew){
  const tr=document.createElement('tr');tr.dataset.id=id;tr.dataset.novo=isNew?'1':'0';
  tr.innerHTML=`<td><input class="in" data-f="nome" autocomplete="off" placeholder="Nome do produto" aria-label="Produto"></td>
    <td><input class="in" data-f="categoria" list="catGrid" placeholder="Categoria" aria-label="Categoria"></td>
    <td><input class="in num r" data-f="qtd" inputmode="numeric" placeholder="1" aria-label="Quantidade"></td>
    <td><input class="in num r" data-f="preco" inputmode="decimal" placeholder="0,00" aria-label="Preço pago unitário"></td>
    <td><button type="button" class="mo" data-g="moeda" title="Trocar moeda"></button></td>
    <td class="r c-brl">—</td><td class="r c-rat">—</td><td class="r c-cus">—</td><td class="r c-est">—</td>
    <td class="r g-end"><span class="g-st"></span><button type="button" class="icon-btn sm del" data-g="del" aria-label="Excluir linha" title="Excluir">${I.trash}</button></td>`;
  gridFill(tr,p);return tr;
}
function gridFill(tr,p){
  const set=(f,v)=>{const i=tr.querySelector(`[data-f="${f}"]`);if(i)i.value=v};
  set('nome',p.nome||'');set('categoria',p.categoria||'');set('qtd',p.qtd!=null?String(p.qtd):'');set('preco',p.preco?num2(p.preco):'');
  const mo=tr.querySelector('.mo');mo.dataset.m=p.moeda||'USD';mo.textContent=MOEDA_TXT[mo.dataset.m];
}
function gridVals(tr){
  const g=f=>tr.querySelector(`[data-f="${f}"]`).value.trim();
  return{nome:g('nome'),categoria:g('categoria'),qtd:parseInt(g('qtd'))||0,preco:r2(parseNum(g('preco'))),moeda:tr.querySelector('.mo').dataset.m};
}
function gridCalc(tr,t,pi){
  const v=gridVals(tr);const c=(k,h)=>{tr.querySelector(k).innerHTML=h};
  if(t.fechada&&pi){c('.c-brl',money(pi.precoBRL));c('.c-rat',money(pi.rateioValor));c('.c-cus',`<b>${money(pi.custo)}</b>`)}
  else if(v.preco>0){const brl=v.moeda==='USD'?v.preco*(+t.v.cotacao||0):v.preco;const cus=r2(brl*(1+t.rateio));c('.c-brl',money(brl));c('.c-rat',money(cus-brl));c('.c-cus',`<b>${money(cus)}</b>`)}
  else{c('.c-brl','—');c('.c-rat','—');c('.c-cus','—')}
  c('.c-est',pi?(pi.estoque>0?intf(pi.estoque):'<span class="pill muted">Esgotado</span>'):'—');
}
function gridStatus(tr,txt,kind){const s=tr.querySelector('.g-st');s.className='g-st '+(kind||'');s.textContent=txt}
function gridSync(t){
  const body=$('#pgBody');if(!body)return;
  if(G.vid!==t.v.id){body.innerHTML='';G.vid=t.v.id}
  const fech=t.fechada;const ids=new Set(t.prods.map(pi=>pi.p.id));
  $$('tr',body).forEach(tr=>{if(tr.dataset.novo!=='1'&&!ids.has(tr.dataset.id))tr.remove()});
  const firstDraft=()=>body.querySelector('tr[data-novo="1"]');
  for(const pi of [...t.prods].sort((a,b)=>(a.p.criadoEm||0)-(b.p.criadoEm||0))){
    let tr=body.querySelector(`tr[data-id="${pi.p.id}"]`);
    if(!tr){tr=gridRow(pi.p.id,pi.p,false);body.insertBefore(tr,firstDraft())}
    else if(tr.dataset.novo==='1')tr.dataset.novo='0';
    if(!tr.contains(document.activeElement)&&tr.dataset.dirty!=='1')gridFill(tr,pi.p);
    gridCalc(tr,t,pi);
  }
  $$('tr[data-novo="1"]',body).forEach(tr=>gridCalc(tr,t,null));
  if(!body.children.length&&!fech)gridAddRow(false);
  $$('input,button',body).forEach(e=>{if(e.dataset.g!=='del')e.disabled=fech});
  $$('[data-g="del"]',body).forEach(e=>e.hidden=fech);
  const mp=t.v.moedaPadrao||'USD';$$('#vMoedaPad button').forEach(b=>{b.classList.toggle('on',b.dataset.m===mp);b.disabled=fech});
  $('#pgAdd').hidden=fech;$('#pgLock').hidden=!fech;$$('[data-act="notasImportar"]').forEach(b=>b.hidden=fech);
  $('#catGrid').innerHTML=[...new Set(S.produtos.map(x=>x.categoria).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join('');
  // rodapé
  const f=$('#pgFoot');const dif=r2(t.base-t.totalPago);
  let last;
  if(t.comprasInf){
    if(dif>1)last=`<div class="w"><small>Falta lançar</small><b>${money(dif)}</b></div>`;
    else if(dif<-1)last=`<div class="w"><small>Passou das compras informadas</small><b>${money(-dif)}</b></div>`;
    else last=`<div class="okb"><small>Conferência</small><b>${I.check.replace('class="ic"','class="ic sm"')} Fechou com a nota</b></div>`;
  }else last=`<div><small>Rateio pela soma dos produtos</small><b>${pct(t.rateio*100)}</b></div>`;
  f.innerHTML=`<div><small>Peças lançadas</small><b>${intf(t.pecas)}</b></div><div><small>Total lançado</small><b>${money(t.totalPago)}</b></div><div><small>${t.comprasInf?'Compras informadas na viagem':'Gasto da viagem'}</small><b>${money(t.comprasInf?t.base:t.despesas)}</b></div>${last}`;
}
function gridAddRow(focus=true){
  const t=D().trip.get(G.vid);if(!t||t.fechada)return;
  const tr=gridRow(db?db.collection('produtos').doc().id:('n'+Date.now()),{moeda:t.v.moedaPadrao||'USD'},true);
  $('#pgBody').append(tr);gridCalc(tr,t,null);
  if(focus)tr.querySelector('[data-f="nome"]').focus();
  return tr;
}
async function gridSave(tr){
  if(!tr.isConnected)return true;
  if(tr._saving){await tr._saving;}
  const t=D().trip.get(G.vid);if(!t||t.fechada)return true;
  const v=gridVals(tr);const id=tr.dataset.id;const old=raw('produtos',id);
  const empty=!v.nome&&!v.qtd&&!v.preco;
  if(empty&&!old){gridStatus(tr,'');return true}
  if(!v.nome||v.qtd<1||!(v.preco>0)){gridStatus(tr,!v.nome?'falta o nome':v.qtd<1?'falta a qtd':'falta o preço','inc');return false}
  if(old){
    const pi=D().prod.get(id);

    if(old.nome===v.nome&&(old.categoria||'')===v.categoria&&+old.qtd===v.qtd&&+old.preco===v.preco&&old.moeda===v.moeda){tr.dataset.dirty='0';gridStatus(tr,'');return true}
  }
  if(!needDb())return false;
  gridStatus(tr,'salvando…','muted');
  const data={...(old||{criadoEm:Date.now()}),viagemId:G.vid,nome:v.nome,categoria:v.categoria,qtd:v.qtd,preco:v.preco,moeda:v.moeda};
  tr._saving=put('produtos',id,data).then(()=>{tr.dataset.dirty='0';tr.dataset.novo='0';gridStatus(tr,'✓ salvo','ok');setTimeout(()=>{if(tr.querySelector('.g-st.ok'))gridStatus(tr,'')},2500);return true})
    .catch(e=>{gridStatus(tr,'não salvou','inc');dbErr(e);return false}).finally(()=>{tr._saving=null});
  return tr._saving;

function gridMount(){
  G.vid=null;const body=$('#pgBody');
  body.addEventListener('input',e=>{const tr=e.target.closest('tr');if(!tr)return;tr.dataset.dirty='1';const t=D().trip.get(G.vid);if(t)gridCalc(tr,t,D().prod.get(tr.dataset.id));if(e.target.dataset.f==='nome')acShow(e.target)});

    if(f!=='preco'){const order=['nome','categoria','qtd','preco'];tr.querySelector(`[data-f="${order[order.indexOf(f)+1]}"]`).focus();return}
    const ok=await gridSave(tr);if(!ok)return;

  });

    if(b.dataset.g==='moeda'){const o=['USD','BRL'];b.dataset.m=o[(o.indexOf(b.dataset.m)+1)%2];b.textContent=MOEDA_TXT[b.dataset.m];tr.dataset.dirty='1';const t=D().trip.get(G.vid);if(t)gridCalc(tr,t,D().prod.get(tr.dataset.id));gridSave(tr);return}
    if(b.dataset.g==='del'){if(raw('produtos',tr.dataset.id))prodExcluir(tr.dataset.id);else tr.remove();return}
  });
  $$('#vMoedaPad button').forEach(b=>b.onclick=async()=>{const v=raw('viagens',G.vid);if(!v||!needDb())return;try{await patch('viagens',v.id,{moedaPadrao:b.dataset.m});$$('#pgBody tr[data-novo="1"]').forEach(tr=>{const p=gridVals(tr);if(!p.nome&&!p.preco){const mo=tr.querySelector('.mo');mo.dataset.m=b.dataset.m;mo.textContent=MOEDA_TXT[b.dataset.m]}})}catch(e){dbErr(e)}});
  window.addEventListener('scroll',acClose,{passive:true});
}

const NOTA_LENDO=new Set();

const NOTA_URL=new Map();
function notaImg(n){
  const k=n.viagemId+'/'+n.arquivo;const c=NOTA_URL.get(k);
  if(c&&c.url&&c.exp>Date.now())return c.url;
  if(SB&&(!c||(!c.pend&&c.exp<=Date.now()))){
    NOTA_URL.set(k,{pend:true,url:c&&c.url||'',exp:0});
    SB.storage.from('notas').createSignedUrl(k,3600).then(({data})=>{NOTA_URL.set(k,{url:data?data.signedUrl:'',exp:Date.now()+(data?3300e3:60e3)});const b=$('#notasList');if(b)b._k='';bump()}).catch(()=>{});
  }
  return c&&c.url||'';
}
function notaPill(n){
  if(NOTA_LENDO.has(n.id))return'<span class="pill gold">Lendo…</span>';

async function compressImg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',.86));
  }finally{URL.revokeObjectURL(url)}
}
async function enviarNota(vid,file){
  const blob=await compressImg(file);
  const id=db.collection('notas').doc().id;const arquivo=id+'.jpg';
  const {error}=await SB.storage.from('notas').upload(vid+'/'+arquivo,blob,{contentType:'image/jpeg',upsert:false});
  if(error)throw error;
  await put('notas',id,{viagemId:vid,arquivo,nome:String(file.name||'nota.jpg').slice(0,120),status:'nova',criadoEm:Date.now()});
  return id;
}
const leituraFila=[];let leituraAtiva=0;
function lerNota(id){if(NOTA_LENDO.has(id))return;NOTA_LENDO.add(id);leituraFila.push(id);bump();lerProx()}
function bump(){ver++;refresh()}
async function lerProx(){
  while(leituraAtiva<2&&leituraFila.length){
    const id=leituraFila.shift();leituraAtiva++;
    (async()=>{
      try{const r=await fetch('/api/ler-nota/'+encodeURIComponent(id),{method:'POST'});const j=await r.json().catch(()=>({}));if(!r.ok)toast(j.erro||'Não consegui ler a nota.','bad')}
      catch(e){toast('Sem conexão com o sistema do notebook.','bad')}
      finally{NOTA_LENDO.delete(id);leituraAtiva--;await db._pull();bump();lerProx()}
    })();
  }
}

  $('#imPyg',el).addEventListener('input',e=>{st.pyg=e.target.value;sumUp()});
  const fileIn=$('#imFile',el),drop=$('#imDrop',el);
  async function upload(files){
    files=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|heic|webp)$/i.test(f.name));if(!files.length)return;
    if(!needDb())return;const up=$('#imUp',el);up.hidden=false;let ok=0,fail=[];
    for(let i=0;i<files.length;i++){
      up.textContent=`Enviando foto ${i+1} de ${files.length}…`;
      try{const id=await enviarNota(vid,files[i]);ok++;if(IA.configurada)lerNota(id)}catch(e){fail.push(files[i].name)}
    }
    up.hidden=true;
    if(ok)toast(`${ok} ${plural(ok,'foto guardada','fotos guardadas')}${IA.configurada?'. Lendo as notas…':''}`);
    if(fail.length)toast(`Não consegui abrir: ${fail.join(', ')}. Use fotos em JPG ou PNG.`,'bad');
  }
  fileIn.onchange=()=>{upload(fileIn.files);fileIn.value=''};
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over')}));
  drop.addEventListener('drop',e=>upload(e.dataTransfer.files));
  el._refresh=()=>{if(!raw('viagens',vid)){closeModal(el);return}renderNotas()};
  renderNotas();
  $('#imOk',el).onclick=async()=>{
    if(!needDb())return;const gs=[...st.groups.entries()];
    if(gs.some(([,g])=>g.moeda==='PYG'&&g.itens.some(x=>x.on))&&!(parseNum(st.pyg)>0)){toast('Informe quantos guaranis valem US$ 1,00.','bad');$('#imPyg',el).focus();return}
    const cur=raw('viagens',vid);if(!cur||cur.status==='fechada'){toast('A viagem está fechada.','bad');return}
    const btn=$('#imOk',el);btn.disabled=true;let n=0;const now=Date.now();
    try{
      for(const [nid,g] of gs){
        const its=g.itens.filter(x=>x.on&&x.nome.trim()&&x.qtd>0&&x.preco>0);if(!its.length&&!g.itens.some(x=>x.on))continue;
        await Promise.all(its.map((x,i)=>{
          const moeda=g.moeda==='BRL'?'BRL':'USD';const preco=g.moeda==='PYG'?r2(x.preco/parseNum(st.pyg)):x.preco;
          return put('produtos',null,{viagemId:vid,nome:x.nome.trim(),categoria:x.categoria.trim(),qtd:x.qtd,preco,moeda,notaId:nid,criadoEm:now+n+i});
        }));
        n+=its.length;await patch('notas',nid,{status:'importada',importados:its.length});
      }
      closeModal(el);toast(`${n} ${plural(n,'produto adicionado','produtos adicionados')} ao estoque.`);
    }catch(e){btn.disabled=false;dbErr(e)}
  };
}

  const L=n.leitura;const prods=S.produtos.filter(p=>p.notaId===id);

    <div class="ninfo">${notaPill(n)}

      ${n.status==='erro'?`<p class="diffwarn" style="margin:0">${esc(n.erro||'')}</p>`:''}

    footer:`<button class="btn danger-ghost left" id="nvDel">${I.trash}Excluir foto</button><button class="btn ghost" data-close>Fechar</button>${n.status!=='importada'&&raw('viagens',n.viagemId)?.status!=='fechada'?`<button class="btn primary" id="nvImp">Conferir e lançar</button>`:''}`});

  $('#nvDel',el).onclick=async()=>{

function prodModal(id,viagemId){
  const d=D();const p=id?raw('produtos',id):null;const pi=p?d.prod.get(id):null;
  const abertas=[...d.trip.values()].filter(t=>!t.fechada).sort((a,b)=>String(b.v.data).localeCompare(String(a.v.data)));
  if(!p&&!abertas.length){toast('Crie uma viagem aberta antes de lançar produtos.','bad');return}
  const fech=!!(pi&&pi.t&&pi.t.fechada);
  const vid=p?p.viagemId:(viagemId||(abertas[0]&&abertas[0].v.id));
  const cats=[...new Set(S.produtos.map(x=>x.categoria).filter(Boolean))].sort();
  const st={moeda:p?p.moeda:'USD'};
  const el=openModal({title:p?'Editar produto':'Adicionar produto',body:`<div class="fgrid">
    <label class="field c6"><span>Viagem <em>*</em></span><select class="in" id="pVia" ${p?'disabled':''}>${(p?[pi.t].filter(Boolean):abertas).map(t=>`<option value="${t.v.id}" ${t.v.id===vid?'selected':''}>${esc(t.v.descricao)} · ${fmtD(t.v.data)}</option>`).join('')}</select></label>
    <label class="field c4"><span>Nome do produto <em>*</em></span><input class="in" id="pNome" value="${esc(p?p.nome:'')}" placeholder="ex.: iPhone 15 128GB"></label>
    <label class="field c2"><span>Código / SKU</span><input class="in" id="pSku" value="${esc(p?p.sku:'')}"></label>
    <label class="field c3"><span>Categoria</span><input class="in" id="pCat" list="catList" value="${esc(p?p.categoria:'')}" placeholder="ex.: Celulares"><datalist id="catList">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="field c3"><span>Quantidade comprada <em>*</em></span><input class="in num" id="pQtd" type="number" min="1" step="1" inputmode="numeric" value="${p?p.qtd:1}" ${fech?'disabled':''}></label>
    <div class="field c3"><span>Moeda do preço pago</span><div class="seg" id="pMoeda"><button type="button" data-m="USD">US$ dólar</button><button type="button" data-m="BRL">R$ real</button></div></div>
    <label class="field c3"><span>Preço pago unitário <em>*</em></span><input class="in num" id="pPreco" inputmode="decimal" value="${p?num2(p.preco):''}" placeholder="0,00" ${fech?'disabled':''}></label>
  </div><div class="panel" id="pPrev" style="background:var(--surface-2)"></div>`,
  footer:`${p?`<button class="btn danger-ghost left" id="pDel">${I.trash}Excluir</button>`:''}<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="pSave">${p?'Salvar':'Adicionar produto'}</button>`});
  const segBtns=$$('#pMoeda button',el);
  const setSeg=()=>segBtns.forEach(b=>b.classList.toggle('on',b.dataset.m===st.moeda));
  segBtns.forEach(b=>b.onclick=()=>{if(fech)return;st.moeda=b.dataset.m;setSeg();prev()});setSeg();
  function prev(){
    const D2=D();const t=D2.trip.get($('#pVia',el).value);if(!t){$('#pPrev',el).innerHTML='';return}
    const qtd=Math.max(0,parseInt($('#pQtd',el).value)||0),preco=parseNum($('#pPreco',el).value);
    if(fech){$('#pPrev',el).innerHTML=`<div class="lockline" style="margin:0">${I.lock}Viagem fechada: preço, quantidade e custo real (${money(pi.custo)}) estão travados. Você pode alterar nome, código e categoria.</div>`;return}
    const brl=st.moeda==='USD'?preco*(+t.v.cotacao||0):preco;
    const old=pi?pi.precoBRL*pi.qtd:0;const tot=t.comprasInf?t.base:t.totalPago-old+brl*qtd;const rate=tot>0?t.despesas/tot:0;const custo=r2(brl*(1+rate));
    $('#pPrev',el).innerHTML=`<div class="dl" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <div><dt>Preço pago em R$</dt><dd class="num"><b>${money(brl)}</b>${st.moeda==='USD'?`<br><small class="hint">US$ ${num2(preco)} × ${money(t.v.cotacao)}</small>`:''}</dd></div>
      <div><dt>Rateio da viagem</dt><dd class="num"><b>${pct(rate*100)}</b></dd></div>
      <div><dt>Valor do rateio</dt><dd class="num"><b>${money(custo-brl)}</b></dd></div>
      <div><dt>Custo real unitário</dt><dd class="num"><b style="color:var(--caramel)">${money(custo)}</b></dd></div></div>
      <p class="hint" style="margin:8px 0 0">${t.comprasInf?`Rateio da viagem: gasto ${money(t.despesas)} ÷ compras ${money(t.base)}. Esse custo real aparece sozinho na hora da venda.`:'Enquanto a viagem estiver aberta, o rateio é recalculado a cada produto ou despesa lançada.'}</p>`;
  }
  ['#pVia','#pQtd','#pPreco'].forEach(s=>$(s,el).addEventListener('input',prev));prev();
  $('#pSave',el).onclick=async()=>{
    if(!needDb())return;
    const nome=$('#pNome',el).value.trim();const qtd=parseInt($('#pQtd',el).value)||0;const preco=r2(parseNum($('#pPreco',el).value));
    if(!nome){toast('Informe o nome do produto.','bad');return}
    if(!fech){
      if(qtd<1){toast('A quantidade deve ser pelo menos 1.','bad');return}
      if(pi&&qtd<pi.vendido){toast(`Já foram vendidas ${pi.vendido} unidades. A quantidade não pode ser menor.`,'bad');return}
      if(!(preco>0)){toast('Informe o preço pago.','bad');return}
    }
    const base=p?{...p}:{criadoEm:Date.now()};
    const data={...base,viagemId:$('#pVia',el).value,nome,sku:$('#pSku',el).value.trim(),categoria:$('#pCat',el).value.trim()};
    if(!fech){data.qtd=qtd;data.preco=preco;data.moeda=st.moeda}
    try{await put('produtos',id,data);closeModal(el);toast(p?'Produto atualizado.':'Produto adicionado.')}catch(e){dbErr(e)}
  };
  const pd=$('#pDel',el);if(pd)pd.onclick=async()=>{
    if(pi&&pi.vendido>0){toast('Este produto já tem vendas e não pode ser excluído.','bad');return}
    if(!await confirmBox(`Excluir o produto <b>${esc(p.nome)}</b>?`))return;
    try{await del('produtos',id);closeModal(el);toast('Produto excluído.')}catch(e){dbErr(e)}
  };
}

  const ev=editId?raw('vendas',editId):null;
  if(editId&&!ev)return;
  if(ev&&S.parcelas.some(p=>p.vendaId===ev.id&&p.tipo==='parcela'&&(p.pagamentos||[]).length)){toast('Esta venda já tem parcela paga. Para mudar os valores, remova o pagamento em A Receber ou edite só a parcela.','bad');return}
  const st={data:todayISO(),clienteId:preCli||'',itens:[],forma:'avista',meio:'Pix',entrada:0,meioEntrada:'Pix',n:3,parcelas:[],cliQ:'',prodQ:''};
  if(ev){
    Object.assign(st,{data:ev.data,clienteId:ev.clienteId,forma:ev.forma||'avista',meio:ev.meio||'Pix',entrada:+ev.entrada||0,meioEntrada:ev.meioEntrada||'Pix',
      itens:(ev.itens||[]).map(i=>({produtoId:i.produtoId,nome:i.nome,viagemId:i.viagemId,custo:+i.custoUnit,qtd:+i.qtd,preco:+i.precoUnit,precoTxt:num2(i.precoUnit)}))});
    st.parcelas=S.parcelas.filter(p=>p.vendaId===ev.id&&p.tipo==='parcela').sort((a,b)=>a.num-b.num).map(p=>({venc:p.venc,valor:+p.valor}));
    st.n=+ev.nParcelas||st.parcelas.length||3;
  }

    <div class="fgrid"><label class="field c2"><span>Data da venda</span><input class="in" type="date" id="nvData" value="${esc(st.data)}"></label><div class="field c4"><span>Cliente <em>*</em></span><div id="nvCli"></div></div></div>
    <div class="sec-t">Produtos</div>
    <label class="search">${I.search}<input class="in" id="nvProdQ" placeholder="Buscar produto com estoque (nome, código ou categoria)" autocomplete="off" aria-label="Buscar produto"></label>

    <div id="nvPag"></div>`,
    footer:`<span class="left hint" id="nvFootTot"></span><button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="nvSave">${I.check}Salvar venda</button>`});
  const tot=()=>{let venda=0,custo=0;for(const it of st.itens){venda+=it.qtd*it.preco;custo+=it.qtd*it.custo}venda=r2(venda);custo=r2(custo);return{venda,custo,lucro:r2(venda-custo),m:venda>0?(venda-custo)/venda*100:0}};
  function gen(){

    st.parcelas=[];for(let i=1;i<=n;i++)st.parcelas.push({venc:addDays(st.data,30*i),valor:i<n?each:r2(base-each*(n-1))});
  }
  function renderCli(){

      $$('[data-cid]',el).forEach(b=>b.onclick=()=>{st.clienteId=b.dataset.cid;st.cliQ='';renderCli()});

  function stockLeft(pid){const pi=D().prod.get(pid);const meu=ev?sum((ev.itens||[]).filter(i=>i.produtoId===pid),i=>i.qtd):0;return pi?pi.estoque+meu:meu}
  function renderProdRes(){

    if(!q){box.innerHTML='';return}
    const l=[...D().prod.values()].filter(pi=>pi.estoque>0&&!st.itens.some(i=>i.produtoId===pi.p.id)&&norm([pi.p.nome,pi.p.sku,pi.p.categoria].join(' ')).includes(q)).slice(0,10);
    box.innerHTML=l.length?`<div class="picks">${l.map(pi=>`<button class="pick" data-pid="${pi.p.id}"><span class="grow"><b>${esc(pi.p.nome)}</b><small>${esc(pi.t?pi.t.v.descricao:'')} · estoque ${pi.estoque}</small></span><span class="num" style="text-align:right"><small>custo real</small>${money(pi.custo)}</span></button>`).join('')}</div>`:'<p class="hint" style="margin:0">Nenhum produto com estoque encontrado.</p>';
    $$('[data-pid]',box).forEach(b=>b.onclick=()=>{const pi=D().prod.get(b.dataset.pid);st.itens.push({produtoId:pi.p.id,nome:pi.p.nome,viagemId:pi.p.viagemId,custo:pi.custo,qtd:1,preco:0,precoTxt:''});st.prodQ='';$('#nvProdQ',el).value='';renderProdRes();renderItens();changed();setTimeout(()=>$(`#nvItens [data-i="${st.itens.length-1}"] [data-f="preco"]`,el)?.focus(),10)});
  }

    $$('[data-f]',box).forEach(inp=>inp.addEventListener('input',()=>{

    const dif=parcDiff();
    box.innerHTML=`<div class="panel" style="padding:8px 10px;margin-top:12px"><div class="tw"><table class="tbl ptable"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="r">Valor (R$)</th></tr></thead><tbody>
      ${st.parcelas.map((p,i)=>`<tr><td><b>${i+1}/${st.n}</b></td><td><input class="in" type="date" data-pv="${i}" value="${p.venc}" style="max-width:170px" aria-label="Vencimento da parcela ${i+1}"></td><td class="r"><input class="in num" data-pval="${i}" inputmode="decimal" value="${num2(p.valor)}" style="max-width:130px;text-align:right" aria-label="Valor da parcela ${i+1}"></td></tr>`).join('')}
      </tbody></table></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 4px 2px"><span class="hint">1ª parcela 30 dias após a venda; as demais a cada 30 dias. Datas e valores podem ser ajustados.</span><span class="diffwarn" id="nvDif">${Math.abs(dif)>0.005?`Diferença de ${money(dif)} entre o total e a soma das parcelas.`:''}</span><button class="btn sm ghost" id="nvRegen" style="margin-left:auto">Recalcular parcelas</button></div></div>`;
    $$('[data-pv]',box).forEach(i=>i.onchange=()=>{st.parcelas[+i.dataset.pv].venc=i.value});
    $$('[data-pval]',box).forEach(i=>i.addEventListener('input',()=>{st.parcelas[+i.dataset.pval].valor=r2(parseNum(i.value));const d2=parcDiff();$('#nvDif',el).textContent=Math.abs(d2)>0.005?`Diferença de ${money(d2)} entre o total e a soma das parcelas.`:''}));
    $('#nvRegen',el).onclick=()=>{gen();renderParc()};
  }
  function changed(){renderTot();if(st.forma==='parcelado'){gen();renderParc()}}
  $('#nvData',el).addEventListener('change',e=>{st.data=e.target.value||todayISO();if(st.forma==='parcelado'){gen();renderParc()}});
  const pq=$('#nvProdQ',el);pq.addEventListener('input',()=>{st.prodQ=pq.value;renderProdRes()});
  $$('#nvForma button',el).forEach(b=>b.onclick=()=>{st.forma=b.dataset.f;if(st.forma==='parcelado')gen();renderPag()});
  el._refresh=()=>{if(st.clienteId&&!raw('clientes',st.clienteId))st.clienteId='';if(st.clienteId)renderCli();renderProdRes()};
  renderCli();renderItens();renderTot();renderPag();
  $('#nvSave',el).onclick=async()=>{
    if(!needDb())return;
    const t=tot();const btn=$('#nvSave',el);
    if(!st.clienteId){toast('Selecione o cliente.','bad');return}
    if(!st.itens.length){toast('Adicione pelo menos um produto.','bad');return}
    for(const it of st.itens){
      if(!(it.qtd>0)){toast(`Informe a quantidade de ${it.nome}.`,'bad');return}
      if(it.qtd>stockLeft(it.produtoId)){toast(`Estoque insuficiente de ${it.nome}.`,'bad');return}
      if(!(it.preco>0)){toast(`Informe o preço de venda de ${it.nome}.`,'bad');return}
    }
    if(st.forma==='parcelado'){
      if(st.entrada>=t.venda){toast('A entrada deve ser menor que o total. Para pagamento total, use À vista.','bad');return}
      if(Math.abs(parcDiff())>0.005){toast('A soma das parcelas mais a entrada precisa ser igual ao total da venda.','bad');return}
      if(st.parcelas.some(p=>!p.venc||!(p.valor>0))){toast('Confira as datas e os valores das parcelas.','bad');return}
    }
    const c=raw('clientes',st.clienteId);
    const venda={data:st.data,clienteId:st.clienteId,clienteNome:c?c.nome:'',itens:st.itens.map(i=>({produtoId:i.produtoId,nome:i.nome,viagemId:i.viagemId,qtd:i.qtd,custoUnit:i.custo,precoUnit:i.preco})),
      total:t.venda,custoTotal:t.custo,forma:st.forma,criadoEm:ev?(ev.criadoEm||Date.now()):Date.now()};
    if(st.forma==='avista')venda.meio=st.meio;else{venda.entrada=st.entrada;venda.nParcelas=st.n;if(st.entrada>0)venda.meioEntrada=st.meioEntrada}
    btn.disabled=true;
    try{
      if(ev)await Promise.all(S.parcelas.filter(p=>p.vendaId===ev.id).map(p=>del('parcelas',p.id)));
      const vid=await put('vendas',ev?ev.id:null,venda);
      const base={vendaId:vid,clienteId:st.clienteId};const ps=[];
      if(st.forma==='avista')ps.push({...base,tipo:'avista',num:1,de:1,valor:t.venda,venc:st.data,pagamentos:[{data:st.data,valor:t.venda,forma:st.meio}]});
      else{
        if(st.entrada>0)ps.push({...base,tipo:'entrada',num:0,de:st.n,valor:st.entrada,venc:st.data,pagamentos:[{data:st.data,valor:st.entrada,forma:st.meioEntrada}]});
        st.parcelas.forEach((p,i)=>ps.push({...base,tipo:'parcela',num:i+1,de:st.n,valor:p.valor,venc:p.venc,pagamentos:[]}));
      }
      await Promise.all(ps.map(p=>put('parcelas',null,p)));
      closeModal(el);toast(ev?'Venda atualizada.':st.forma==='avista'?'Venda registrada.':`Venda registrada com ${st.n} ${plural(st.n,'parcela','parcelas')}.`);
    }catch(e){btn.disabled=false;dbErr(e)}
  };
}

/* ---------- PAGAMENTO ---------- */
function payModal(pid){
  const el=openModal({title:'Registrar pagamento',body:'<div id="pyBody"></div>',footer:'<button class="btn ghost" data-close>Fechar</button><button class="btn primary" id="pySave">Registrar pagamento</button>'});
  let first=true;
  el._refresh=()=>{
    const p=D().parcMap.get(pid);if(!p){closeModal(el);return}
    const pgs=p.pagamentos||[];
    const keep=first?null:{d:$('#pyData',el)?.value,v:$('#pyValor',el)?.value,f:$('#pyForma',el)?.value};first=false;
    $('#pyBody',el).innerHTML=`<div class="dl" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div><dt>Cliente</dt><dd><b>${esc(p.cliente?.nome||'—')}</b></dd></div><div><dt>Parcela</dt><dd><b>${label(p)}</b> · venc. ${fmtD(p.venc)}</dd></div>
      <div><dt>Valor da parcela</dt><dd class="num">${money(p.valor)}</dd></div><div><dt>Em aberto</dt><dd class="num"><b>${money(p.rest)}</b> ${stPill(p)}</dd></div></div>
      ${p.rest>0?`<div class="fgrid"><label class="field c2"><span>Data do pagamento</span><input class="in" type="date" id="pyData" value="${keep?.d||todayISO()}"></label>
      <label class="field c2"><span>Valor recebido (R$)</span><input class="in num" id="pyValor" inputmode="decimal" value="${keep?.v??num2(p.rest)}"></label>
      <label class="field c2"><span>Forma</span><select class="in" id="pyForma">${MEIOS.map(m=>`<option ${m===(keep?.f||'Pix')?'selected':''}>${m}</option>`).join('')}</select></label></div>
      <p class="hint" style="margin:-6px 0 0">Pagamento parcial: o restante continua em aberto nesta mesma parcela.</p>`:'<div class="lockline" style="margin:0">'+I.check+'Parcela quitada.</div>'}
      ${pgs.length?`<div><div class="sec-t" style="margin-bottom:4px">Pagamentos registrados</div><div class="paylist">${pgs.map((x,i)=>`<div><span class="num">${fmtD(x.data)} · ${esc(x.forma)}</span><span class="num"><b>${money(x.valor)}</b> <button class="btn sm danger-ghost" data-rm="${i}" aria-label="Remover pagamento">${I.trash}</button></span></div>`).join('')}</div></div>`:''}`;
    $('#pySave',el).hidden=!(p.rest>0);
    $$('[data-rm]',el).forEach(b=>b.onclick=async()=>{
      if(!await confirmBox(`Remover o pagamento de <b>${money(pgs[+b.dataset.rm].valor)}</b>? O valor volta a ficar em aberto.`,'Remover'))return;
      const np=pgs.filter((_,i)=>i!==+b.dataset.rm);try{await patch('parcelas',pid,{pagamentos:np});toast('Pagamento removido.')}catch(e){dbErr(e)}
    });
  };
  el._refresh();
  $('#pySave',el).onclick=async()=>{
    if(!needDb())return;const p=D().parcMap.get(pid);if(!p)return;
    const valor=r2(parseNum($('#pyValor',el).value)),data=$('#pyData',el).value;
    if(!(valor>0)){toast('Informe o valor recebido.','bad');return}
    if(valor>p.rest+0.005){toast(`O valor é maior que o restante (${money(p.rest)}).`,'bad');return}
    if(!data){toast('Informe a data do pagamento.','bad');return}
    try{await patch('parcelas',pid,{pagamentos:[...(p.pagamentos||[]),{data,valor,forma:$('#pyForma',el).value}]});closeModal(el);toast(valor<p.rest-0.005?`Pagamento parcial registrado. Restam ${money(p.rest-valor)}.`:'Parcela quitada.')}catch(e){dbErr(e)}
  };
}

  fill(){

    let recebido=0;for(const p of S.parcelas)for(const x of p.pagamentos||[])if(x.data>=de&&x.data<=ate)recebido+=+x.valor||0;
    const atrV=sum(d.atrasadas,p=>p.rest);
    // produtos
    const gp=new Map();for(const i of its){const g=gp.get(i.produtoId)||{nome:i.nome,via:i.viagemId,qtd:0,rec:0,luc:0};g.qtd+=i.qtd;g.rec+=i.qtd*i.precoUnit;g.luc+=i.qtd*(i.precoUnit-i.custoUnit);gp.set(i.produtoId,g)}
    const top=[...gp.values()].sort((a,b)=>b.qtd-a.qtd||b.rec-a.rec).slice(0,10);const mxQ=Math.max(1,...top.map(x=>x.qtd));
    // clientes
    const gc=new Map();for(const i of its){const g=gc.get(i.v.clienteId)||{id:i.v.clienteId,vendas:new Set(),rec:0,luc:0};g.vendas.add(i.v.id);g.rec+=i.qtd*i.precoUnit;g.luc+=i.qtd*(i.precoUnit-i.custoUnit);gc.set(i.v.clienteId,g)}
    const topC=[...gc.values()].sort((a,b)=>b.rec-a.rec).slice(0,10);
    // viagens
    const gv=new Map();for(const i of its){const g=gv.get(i.viagemId)||{vend:0,custo:0,qtd:0};g.vend+=i.qtd*i.precoUnit;g.custo+=i.qtd*i.custoUnit;g.qtd+=i.qtd;gv.set(i.viagemId,g)}
    const lv=[...gv.entries()].map(([id,g])=>({id,t:d.trip.get(id),...g,luc:g.vend-g.custo})).sort((a,b)=>b.luc-a.luc);const mxL=Math.max(1,...lv.map(x=>Math.abs(x.luc)));
    // estoque parado

    // inadimplentes
    const gi=new Map();for(const p of d.atrasadas){const g=gi.get(p.clienteId)||{c:p.cliente,n:0,v:0,mx:0,first:p};g.n++;g.v+=p.rest;if(p.dias>g.mx){g.mx=p.dias;g.first=p}gi.set(p.clienteId,g)}
    const inad=[...gi.values()].sort((a,b)=>b.v-a.v);

function rowsFor(tipo){
  const d=D();
  if(tipo==='vendas'){
    const r=[['Data','Cliente','Produto','Viagem','Qtd','Custo unit. (R$)','Preço unit. (R$)','Total item (R$)','Custo item (R$)','Lucro (R$)','Margem %','Pagamento']];
    for(const v of [...S.vendas].sort((a,b)=>String(a.data).localeCompare(String(b.data))))for(const i of v.itens||[]){const t=i.qtd*i.precoUnit,c=i.qtd*i.custoUnit;r.push([fmtD(v.data),d.cMap.get(v.clienteId)?.nome||v.clienteNome||'',i.nome,d.vMap.get(i.viagemId)?.descricao||'',i.qtd,r2(i.custoUnit),r2(i.precoUnit),r2(t),r2(c),r2(t-c),t>0?r2((t-c)/t*100):0,v.forma==='parcelado'?`Parcelado ${v.nParcelas}x`:`À vista ${v.meio||''}`])}
    return{name:'vendas',sheet:'Vendas',r};
  }
  if(tipo==='parcelas'){
    const sl={paga:'Paga',avencer:'A vencer',hoje:'Vence hoje',atrasada:'Atrasada'};
    const r=[['Cliente','Telefone','Data da venda','Parcela','Valor (R$)','Pago (R$)','Restante (R$)','Vencimento','Status','Dias de atraso']];
    for(const p of [...d.parc].sort((a,b)=>a.venc.localeCompare(b.venc)))r.push([p.cliente?.nome||'',fmtPhone(p.cliente?.telefone),fmtD(p.venda?.data),label(p),r2(p.valor),r2(p.pago),r2(p.rest),fmtD(p.venc),sl[p.st],p.dias]);
    return{name:'parcelas',sheet:'Parcelas',r};
  }
  const r=[['Viagem','Produto','SKU','Categoria','Qtd comprada','Vendido','Estoque','Moeda','Preço pago unit.','Preço pago (R$)','Rateio unit. (R$)','Custo real unit. (R$)','Estoque a custo (R$)']];
  for(const pi of d.prod.values())r.push([pi.t?.v.descricao||'',pi.p.nome,pi.p.sku||'',pi.p.categoria||'',pi.qtd,pi.vendido,pi.estoque,pi.p.moeda==='USD'?'US$':'R$',r2(pi.p.preco),r2(pi.precoBRL),r2(pi.rateioValor),r2(pi.custo),r2(Math.max(0,pi.estoque)*pi.custo)]);
  return{name:'produtos',sheet:'Produtos',r};
}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.append(s)})}
async function exportar(tipo,fmt){
  const dl={save:async({filename,data})=>{const b=new Blob([data],{type:filename.endsWith('.csv')?'text/csv;charset=utf-8':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}};
  const {name,sheet,r}=rowsFor(tipo);const fn=`2-na-fronteiras-${name}-${todayISO()}`;
  try{
    if(fmt==='csv'){
      const cell=v=>{if(typeof v==='number')return String(v).replace('.',',');const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
      await dl.save({filename:fn+'.csv',data:'﻿'+r.map(x=>x.map(cell).join(';')).join('\r\n')});
    }else{
      await loadXLSX();const ws=XLSX.utils.aoa_to_sheet(r);ws['!cols']=r[0].map((h,i)=>({wch:Math.min(40,Math.max(String(h).length,...r.slice(1,200).map(x=>String(x[i]??'').length))+2)}));
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,sheet);
      await dl.save({filename:fn+'.xlsx',data:XLSX.write(wb,{bookType:'xlsx',type:'array'})});
    }
    toast('Arquivo exportado.');
  }catch(e){if(e&&e.code==='declined')return;toast('Não foi possível exportar agora.','bad');console.error(e)}
}
function exportModal(){
  const it=[['vendas','Vendas','uma linha por produto vendido, com custo, lucro e margem'],['parcelas','Parcelas','todas as parcelas com valor pago, restante e status'],['produtos','Produtos','estoque, preço pago, rateio e custo real']];

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)})}
async function loadPDF(){if(!window.jspdf)await loadScript('jspdf.umd.min.js');if(!window.jspdf.jsPDF.API.autoTable)await loadScript('jspdf.plugin.autotable.min.js')}
function estoqueAgrupado(){
  const m=new Map();
  for(const pi of D().prod.values()){if(pi.estoque<=0)continue;const k=norm(pi.p.nome);
    const g=m.get(k)||{nome:pi.p.nome,categoria:pi.p.categoria||'',qtd:0,custoTot:0};g.qtd+=pi.estoque;g.custoTot+=pi.estoque*pi.custo;if(!g.categoria&&pi.p.categoria)g.categoria=pi.p.categoria;m.set(k,g)}
  return [...m.values()].sort((a,b)=>(a.categoria||'zzz').localeCompare(b.categoria||'zzz')||a.nome.localeCompare(b.nome));
}
function pdfModal(){
  const L=estoqueAgrupado();
  if(!L.length){toast('Não há produtos em estoque para colocar no PDF.','bad');return}
  const el=openModal({title:'PDF do estoque',body:`<p style="margin:0;color:var(--ink-2)">Lista dos produtos disponíveis, com nome, categoria e quantidade. Produtos iguais de viagens diferentes aparecem juntos, com a quantidade somada.</p>

    footer:`<button class="btn ghost" data-close>Cancelar</button><button class="btn primary" id="pdfGo">${I.down}Gerar PDF</button>`});
  el._esc=true;
  $('#pdfGo',el).onclick=async()=>{
    const b=$('#pdfGo',el);b.disabled=true;
    try{await loadPDF();gerarPDF(L,$('#pdfCat',el).checked,$('#pdfCusto',el).checked);closeModal(el);toast('PDF gerado.')}
    catch(e){console.error(e);b.disabled=false;toast('Não consegui gerar o PDF.','bad')}

function gerarPDF(L,porCat,custo){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=14;const MARROM=[58,36,22],CARAMELO=[174,106,47],CREME=[247,239,226],DOURADO=[194,146,58];
  const brl=v=>money(v).replace(/ /g,' ');
  let y=14;const logo=S.config&&S.config.logo;
  if(logo){try{const fmt=logo.startsWith('data:image/png')?'PNG':'JPEG';doc.addImage(logo,fmt,M,y,22,22);}catch(e){}}
  const x0=logo?M+27:M;
  doc.setTextColor(...MARROM);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('2 na Fronteiras',x0,y+9);
  doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(110,84,65);doc.text('Produtos disponíveis em estoque',x0,y+15.5);

  y+=26;doc.setDrawColor(...DOURADO);doc.setLineWidth(.4);doc.setLineDashPattern([.8,1.6],0);doc.line(M,y,W-M,y);doc.setLineDashPattern([],0);y+=5;
  const head=[['Produto'].concat(porCat?[]:['Categoria']).concat(['Disponível']).concat(custo?['Custo unit.','Total a custo']:[])];
  const row=x=>[x.nome].concat(porCat?[]:[x.categoria||'—']).concat([String(x.qtd)]).concat(custo?[brl(x.custoTot/x.qtd),brl(x.custoTot)]:[]);
  const right={};const ci=porCat?1:2;right[ci]={halign:'right',cellWidth:24};if(custo){right[ci+1]={halign:'right',cellWidth:30};right[ci+2]={halign:'right',cellWidth:32}}
  const base={theme:'plain',margin:{left:M,right:M,bottom:16},styles:{font:'helvetica',fontSize:10,textColor:MARROM,cellPadding:{top:2.4,bottom:2.4,left:3,right:3},lineColor:[227,208,179],lineWidth:{bottom:.2}},
    headStyles:{fillColor:MARROM,textColor:[255,247,234],fontStyle:'bold',fontSize:9},alternateRowStyles:{fillColor:[251,246,238]},columnStyles:right,didParseCell:d=>{if(d.section==='head'&&right[d.column.index])d.cell.styles.halign='right'}};
  const grupos=porCat?[...L.reduce((m,x)=>{const k=x.categoria||'Sem categoria';(m.get(k)||m.set(k,[]).get(k)).push(x);return m},new Map())]:[['',L]];
  for(const [cat,itens] of grupos){
    if(porCat){
      if(y>265){doc.addPage();y=16}
      doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...CARAMELO);doc.text(cat,M,y+4);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(152,129,108);doc.text(`${itens.length} ${itens.length===1?'produto':'produtos'} · ${sum(itens,x=>x.qtd)} ${sum(itens,x=>x.qtd)===1?'peça':'peças'}`,W-M,y+4,{align:'right'});y+=7;
    }
    doc.autoTable({...base,startY:y,head,body:itens.map(row)});
    y=doc.lastAutoTable.finalY+8;
  }
  if(custo){if(y>270){doc.addPage();y=16}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(...MARROM);doc.text(`Estoque a custo: ${brl(sum(L,x=>x.custoTot))}`,W-M,y,{align:'right'})}
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(152,129,108);
    doc.text('2 na Fronteiras · Brasil ⇄ Paraguai'.replace('⇄','-'),M,289);doc.text(`Página ${i} de ${n}`,W-M,289,{align:'right'});}
  const blob=doc.output('blob');const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`2-na-fronteiras-estoque-${todayISO()}${custo?'-com-custo':''}.pdf`;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
}

      {c:'c2',dd:-2,it:[['p6',1,4200]],ent:1000,n:6}];
    for(const s of sales){
      const data=addDays(h,s.dd);const itens=s.it.map(([k,q,pr])=>({produtoId:P[k].id,nome:P[k].nome,viagemId:P[k].viagemId,qtd:q,custoUnit:P[k].custo,precoUnit:pr}));
      const total=r2(sum(itens,i=>i.qtd*i.precoUnit)),custoTotal=r2(sum(itens,i=>i.qtd*i.custoUnit));
      const v={data,clienteId:C[s.c].id,clienteNome:C[s.c].nome,itens,total,custoTotal,forma:s.av?'avista':'parcelado',criadoEm:now,...X};
      if(s.av)v.meio=s.av;else{v.entrada=s.ent||0;v.nParcelas=s.n;if(s.ent)v.meioEntrada='Pix'}
      const vid=await put('vendas',null,v);const base={vendaId:vid,clienteId:C[s.c].id,...X};const ps=[];
      if(s.av)ps.push({...base,tipo:'avista',num:1,de:1,valor:total,venc:data,pagamentos:[{data,valor:total,forma:s.av}]});
      else{
        if(s.ent)ps.push({...base,tipo:'entrada',num:0,de:s.n,valor:s.ent,venc:data,pagamentos:[{data,valor:s.ent,forma:'Pix'}]});
        const b=r2(total-(s.ent||0)),each=Math.floor(b/s.n*100)/100;
        for(let i=1;i<=s.n;i++){const val=i<s.n?each:r2(b-each*(s.n-1));const venc=addDays(data,30*i);const pg=s.pagas&&s.pagas[i];
          ps.push({...base,tipo:'parcela',num:i,de:s.n,valor:val,venc,pagamentos:pg?[{data:addDays(venc,pg==='full'?1:0),valor:pg==='full'?val:pg,forma:'Pix'}]:[]})}
      }
      await Promise.all(ps.map(p=>put('parcelas',null,p)));
    }
    toast('Dados de exemplo carregados.');
  }catch(e){dbErr(e)}finally{if(btn)btn.disabled=false}
}
async function removerExemplo(){
  if(!needDb())return;
  if(!await confirmBox('Remover todos os dados de exemplo? Seus próprios cadastros não são afetados.','Remover exemplos'))return;
  try{for(const c of ['parcelas','vendas','produtos','clientes','viagens'])await Promise.all(S[c].filter(x=>x.exemplo).map(x=>del(c,x.id)));ui.viagemId=null;toast('Dados de exemplo removidos.');renderFull()}catch(e){dbErr(e)}
}

/* ---- Banco de dados online (Supabase): login, dados compartilhados e fotos ---- */
(function(){
  const note=$('#dbnote');const cfg=window.NF_CONFIG||{};
  const aviso=t=>{note.hidden=!t;note.textContent=t||''};
  if(!window.supabase||!cfg.url||!cfg.chave){aviso('O sistema ainda não foi ligado ao banco online (arquivo config.js sem o endereço ou a chave da Supabase).');return}
  const sb=window.supabase.createClient(cfg.url,cfg.chave,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB=sb;
  let lastTxt='',pullP=null,timer=null,ativo=false;
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
  const falha=(error)=>{const e=new Error(error&&error.message||'erro');const c=String(error&&(error.code||error.status)||'');
    e.code=/42501|401|403|PGRST301|JWT/.test(c+(error&&error.message||''))?'invalid_argument':/413|payload/i.test(c+(error&&error.message||''))?'quota_exceeded':'unavailable';
    if(/JWT|401/.test(c+(error&&error.message||'')))sb.auth.refreshSession().catch(()=>{});return e};
  async function carregar(){
    const out=[];
    for(let de=0;;de+=1000){
      const {data,error}=await sb.from('docs').select('colecao,id,dados').order('colecao').order('id').range(de,de+999);
      if(error)throw error;out.push(...data);if(data.length<1000)break;
    }
    return out;
  }
  async function load(){
    if(!ativo)return;
    try{
      const rows=await carregar();const txt=JSON.stringify(rows);
      if(note.dataset.off==='1'){note.dataset.off='';aviso('')}
      if(txt===lastTxt)return;lastTxt=txt;
      const j={};for(const c of COLS)j[c]=[];let conf=null;
      for(const r of rows){if(r.colecao==='config'){if(r.id==='geral')conf=r.dados;continue}(j[r.colecao]||(j[r.colecao]=[])).push({id:r.id,...r.dados})}
      for(const c of COLS)S[c]=j[c]||[];S.config=conf||{};
      if(!dbReady){dbReady=true;aviso('')}
      ver++;refresh();
    }catch(e){note.dataset.off='1';aviso('Sem conexão com o banco online. Verifique a internet; o sistema tenta de novo sozinho.');console.error(e)}
  }
  function pull(){if(!pullP)pullP=new Promise(r=>setTimeout(r,40)).then(load).finally(()=>{pullP=null});return pullP}
  const ref=(c,id)=>({id,path:c+'/'+id,
    async set(d){const {error}=await sb.from('docs').upsert({colecao:c,id,dados:d});if(error)throw falha(error);await pull()},
    async update(d){const {error}=await sb.rpc('docs_juntar',{p_colecao:c,p_id:id,p_dados:d});if(error)throw falha(error);await pull()},
    async delete(){
      if(c==='notas'){const n=S.notas.find(x=>x.id===id);if(n&&n.arquivo)await sb.storage.from('notas').remove([n.viagemId+'/'+n.arquivo]).catch(()=>{})}
      const {error}=await sb.from('docs').delete().eq('colecao',c).eq('id',id);if(error)throw falha(error);await pull()}});
  const dbObj={_pull:pull,collection:c=>({doc:id=>ref(c,id||newId())}),doc:p=>{const[c,id]=p.split('/');return ref(c,id)}};

  /* ---------- tela de login ---------- */
  const box=document.createElement('div');box.id='auth';box.hidden=true;document.body.append(box);
  function tela(modo,msg){
    document.body.classList.add('locked');box.hidden=false;
    const logo=S.config&&S.config.logo?`<img src="${esc(S.config.logo)}" alt="">`:I.plane;
    const cab=`<div class="au-logo">${logo}</div><div class="au-t">2 na Fronteiras</div><div class="au-r">${routeSVG()}</div>`;
    const m=msg?`<p class="au-msg ${msg.ok?'ok':''}">${esc(msg.t)}</p>`:'';
    if(modo==='entrar')box.innerHTML=`<form class="au-card" id="auF" autocomplete="on">${cab}${m}
      <label class="field"><span>E-mail</span><input class="in" type="email" id="auEmail" autocomplete="username" required></label>
      <label class="field"><span>Senha</span><input class="in" type="password" id="auSenha" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit" id="auOk">Entrar</button>
      <button class="au-link" type="button" id="auEsq">Esqueci minha senha</button></form>`;
    else if(modo==='esqueci')box.innerHTML=`<form class="au-card" id="auF">${cab}${m}<p class="au-p">Digite seu e-mail. Você vai receber um link para criar uma senha nova.</p>
      <label class="field"><span>E-mail</span><input class="in" type="email" id="auEmail" autocomplete="username" required></label>
      <button class="btn primary" type="submit" id="auOk">Enviar link</button><button class="au-link" type="button" id="auVolta">Voltar para entrar</button></form>`;
    else if(modo==='nova')box.innerHTML=`<form class="au-card" id="auF">${cab}${m}<p class="au-p">Crie sua nova senha (mínimo 8 caracteres).</p>
      <label class="field"><span>Nova senha</span><input class="in" type="password" id="auS1" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>Repita a senha</span><input class="in" type="password" id="auS2" autocomplete="new-password" minlength="8" required></label>
      <button class="btn primary" type="submit" id="auOk">Salvar senha</button></form>`;
    else if(modo==='negado')box.innerHTML=`<div class="au-card">${cab}<p class="au-msg">Seu e-mail (${esc(msg&&msg.email||'')}) ainda não foi liberado para usar o sistema.</p>
      <p class="au-p">Peça para o responsável incluir o seu e-mail na lista de membros da Supabase e depois toque em “Tentar de novo”.</p>
      <button class="btn primary" type="button" id="auTenta">Tentar de novo</button><button class="au-link" type="button" id="auSair">Sair</button></div>`;
    const f=$('#auF',box);const bt=$('#auOk',box);
    const busy=on=>{if(bt){bt.disabled=on;bt.textContent=on?'Aguarde…':({entrar:'Entrar',esqueci:'Enviar link',nova:'Salvar senha'})[modo]}};
    if(modo==='entrar'){
      $('#auEsq',box).onclick=()=>tela('esqueci');
      f.onsubmit=async e=>{e.preventDefault();busy(true);
        const {error}=await sb.auth.signInWithPassword({email:$('#auEmail',box).value.trim(),password:$('#auSenha',box).value});
        busy(false);if(error)tela('entrar',{t:/invalid/i.test(error.message)?'E-mail ou senha incorretos.':/rate|many/i.test(error.message)?'Muitas tentativas. Espere alguns minutos.':'Não foi possível entrar agora. Verifique a internet.'});};
      setTimeout(()=>$('#auEmail',box)?.focus(),30);
    }
    if(modo==='esqueci'){
      $('#auVolta',box).onclick=()=>tela('entrar');
      f.onsubmit=async e=>{e.preventDefault();busy(true);
        await sb.auth.resetPasswordForEmail($('#auEmail',box).value.trim(),{redirectTo:location.origin+location.pathname});
        busy(false);tela('entrar',{t:'Se o e-mail estiver cadastrado, o link chega em alguns minutos. Confira também o spam.',ok:true});};
    }
    if(modo==='nova'){
      f.onsubmit=async e=>{e.preventDefault();const a=$('#auS1',box).value,b=$('#auS2',box).value;
        if(a.length<8){tela('nova',{t:'A senha precisa ter pelo menos 8 caracteres.'});return}
        if(a!==b){tela('nova',{t:'As senhas não conferem.'});return}
        busy(true);const {error}=await sb.auth.updateUser({password:a});busy(false);
        if(error){tela('nova',{t:'Não foi possível salvar a senha. Peça um novo link.'});return}
        history.replaceState(null,'',location.pathname);toast('Senha alterada.');entrar();};
    }
    if(modo==='negado'){$('#auTenta',box).onclick=()=>entrar();$('#auSair',box).onclick=()=>sb.auth.signOut()}
  }
  function liberar(email){
    document.body.classList.remove('locked');box.hidden=true;box.innerHTML='';
    const u=$('#sideUser');if(u){u.hidden=false;u.innerHTML=`<span title="${esc(email)}">${esc(email)}</span><button type="button" class="btn sm ghost" id="btnSair">Sair</button>`;$('#btnSair').onclick=async()=>{if(await confirmBox('Sair do sistema neste aparelho?','Sair',false))sb.auth.signOut()}}
  }
  let entrando=null;
  async function entrar(){
    if(entrando)return entrando;
    entrando=(async()=>{
      const {data:{session}}=await sb.auth.getSession();
      if(!session){ativo=false;db=null;tela('entrar');return}
      const email=session.user&&session.user.email||'';
      const {data:ok,error}=await sb.rpc('eh_membro');
      if(error){aviso('Não consegui conferir o seu acesso. Verifique a internet.');tela('entrar',{t:'Não foi possível conferir o acesso agora.'});return}
      if(!ok){ativo=false;db=null;tela('negado',{email});return}
      db=dbObj;ativo=true;liberar(email);await load();
      if(!timer)timer=setInterval(()=>{if(!document.hidden)load()},8000);
    })().finally(()=>{entrando=null});
    return entrando;
  }
  sb.auth.onAuthStateChange((ev)=>{
    if(ev==='PASSWORD_RECOVERY'){tela('nova');return}
    if(ev==='SIGNED_OUT'){ativo=false;db=null;lastTxt='';for(const c of COLS)S[c]=[];S.config={};dbReady=false;ver++;tela('entrar');return}
    if(ev==='SIGNED_IN')setTimeout(()=>{if(!/type=recovery/.test(location.hash))entrar()},0);
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ativo)load()});
  if(/type=recovery/.test(location.hash))tela('nova');else entrar();
})();
</script>
